<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>IronFit Gym</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            scroll-behavior: smooth;
        }

        body {
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
            line-height: 1.6;
        }

        /* NAVBAR */

        header {
            position: fixed;
            width: 100%;
            top: 0;
            left: 0;
            background: rgba(0, 0, 0, 0.95);
            z-index: 1000;
            border-bottom: 1px solid #333;
        }

        nav {
            max-width: 1200px;
            margin: auto;
            padding: 18px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
            color: #ff3c00;
        }

        .logo span {
            color: white;
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 30px;
        }

        nav ul li a {
            color: white;
            text-decoration: none;
            font-size: 16px;
            transition: 0.3s;
        }

        nav ul li a:hover {
            color: #ff3c00;
        }

        .menu-btn {
            display: none;
            font-size: 28px;
            cursor: pointer;
        }

        /* HERO */

        .hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 100px 20px 50px;

            background:
                linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.8)),
                url("https://images.unsplash.com/photo-1534438327276-14e5300c3a48?auto=format&fit=crop&w=1600&q=80");

            background-size: cover;
            background-position: center;
        }

        .hero-content {
            max-width: 800px;
        }

        .hero h1 {
            font-size: 60px;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        .hero h1 span {
            color: #ff3c00;
        }

        .hero p {
            font-size: 20px;
            color: #ddd;
            margin-bottom: 30px;
        }

        .btn {
            display: inline-block;
            padding: 14px 30px;
            background: #ff3c00;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            transition: 0.3s;
        }

        .btn:hover {
            background: #d93200;
            transform: translateY(-3px);
        }

        /* COMMON */

        section {
            padding: 90px 30px;
        }

        .container {
            max-width: 1200px;
            margin: auto;
        }

        .section-title {
            text-align: center;
            margin-bottom: 50px;
        }

        .section-title h2 {
            font-size: 40px;
            text-transform: uppercase;
        }

        .section-title span {
            color: #ff3c00;
        }

        .section-title p {
            color: #aaa;
            margin-top: 10px;
        }

        /* ABOUT */

        .about {
            background: #181818;
        }

        .about-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 50px;
            align-items: center;
        }

        .about-image img {
            width: 100%;
            border-radius: 10px;
        }

        .about-text h3 {
            font-size: 30px;
            margin-bottom: 20px;
        }

        .about-text p {
            color: #bbb;
            margin-bottom: 20px;
        }

        .features {
            list-style: none;
            margin-bottom: 25px;
        }

        .features li {
            margin: 12px 0;
        }

        .features li::before {
            content: "✓";
            color: #ff3c00;
            font-weight: bold;
            margin-right: 10px;
        }
